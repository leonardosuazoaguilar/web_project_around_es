<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around The U.S.</title>
    <link href="./pages/index.css" rel="stylesheet" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          alt="Logotipo Around The U.S."
          class="logo header__logo"
          src="./images/logo.svg"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <img
            class="profile__image"
            src="./images/avatar.jpg"
            alt="Avatar de Jacques Cousteau"
          />
          <div class="profile__info">
            <h1 class="profile__title">Jacques Cousteau</h1>
            <button
              aria-label="Editar perfil"
              class="profile__edit-button button-interactive"
              type="button"
            ></button>
            <p class="profile__description">Explorador</p>
          </div>
          <button
            aria-label="Agregar tarjeta"
            class="profile__add-button button-interactive"
            type="button"
          ></button>
        </section>

        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <img class="card__image" src="" alt="Imagen de la tarjeta" />
                <button
                  aria-label="Eliminar tarjeta"
                  class="card__delete-button button-interactive"
                  type="button"
                ></button>
                <div class="card__description">
                  <h2 class="card__title"></h2>
                  <button
                    aria-label="Botón Me gusta"
                    class="card__like-button button-interactive"
                    type="button"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">© 2026 Leonardo Suazo.</p>
      </footer>
      <div class="popup" id="edit-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close button-interactive"
            type="button"
          ></button>
          <h3 class="popup__title">Editar perfil</h3>
          <form class="popup__form" id="edit-profile-form" novalidate>
            <div class="popup__field">
              <input
                class="popup__input popup__input_type_name"
                id="profile-name-input"
                name="name"
                placeholder="Nombre"
                type="text"
                minlength="2"
                maxlength="40"
                required
              />
              <span class="popup__input-error profile-name-input-error"></span>
            </div>
            <div class="popup__field">
              <input
                class="popup__input popup__input_type_description"
                id="profile-description-input"
                name="description"
                placeholder="Acerca de mí"
                type="text"
                minlength="2"
                maxlength="200"
                required
              />
              <span
                class="popup__input-error profile-description-input-error"
              ></span>
            </div>
            <button
              class="button popup__button button-interactive"
              type="submit"
            >
              Guardar
            </button>
          </form>
        </div>
      </div>
      <div class="popup" id="new-card-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close button-interactive"
            type="button"
          ></button>
          <h3 class="popup__title">Nuevo lugar</h3>
          <form class="popup__form" id="new-card-form" novalidate>
            <div class="popup__field">
              <input
                class="popup__input popup__input_type_card-name"
                id="card-name-input"
                name="place-name"
                placeholder="Título"
                type="text"
                minlength="2"
                maxlength="30"
                required
              />
              <span class="popup__input-error card-name-input-error"></span>
            </div>
            <div class="popup__field">
              <input
                class="popup__input popup__input_type_url"
                id="card-url-input"
                name="link"
                placeholder="Enlace a la imagen"
                type="url"
                required
              />
              <span class="popup__input-error card-url-input-error"></span>
            </div>
            <button
              class="button popup__button button-interactive"
              type="submit"
            >
              Guardar
            </button>
          </form>
        </div>
      </div>

      <div class="popup popup_type_image" id="image-popup">
        <div class="popup__content popup__content_content_image">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close button-interactive"
            type="button"
          ></button>
          <img
            alt="Imagen ampliada de la tarjeta seleccionada"
            class="popup__image"
            src="#"
          />
          <p class="popup__caption"></p>
        </div>
      </div>
    </div>
    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
